<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleetpay: phone financing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface2:#F5F8FC; --ink:#0F1A33; --ink2:#3F4D68; --muted:#68768F;
  --line:#D9E0EB; --line2:#E8EDF5; --brand:#3347FF; --brand-ink:#FFFFFF; --brand-soft:#E3E8FF;
  --side:#16224F; --side-ink:#B9C4E6; --side-act:rgba(255,255,255,.13); --side-line:rgba(255,255,255,.12);
  --ok:#14764A; --ok-bg:#DAF1E4; --warn:#855700; --warn-bg:#FBEBC3; --rest:#9E3D08; --rest-bg:#FADAC4;
  --lock:#A3182A; --lock-bg:#F8D3D8; --rev:#5A2AB3; --rev-bg:#E6DAF8; --off:#46566A; --off-bg:#E2E8EF;
  --bar0:#9FB0FF; --bar1:#F2B73B; --bar2:#EE8236; --bar3:#D8394B;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1224; --surface:#141C33; --surface2:#19223B; --ink:#E8EDF8; --ink2:#B4BFD6; --muted:#8B98B3;
    --line:#26314F; --line2:#1E2843; --brand:#7C8BFF; --brand-ink:#0C1224; --brand-soft:#232C5A;
    --side:#0A1030; --side-ink:#9FACD3;
    --ok:#6FD3A0; --ok-bg:#15382A; --warn:#F0C05A; --warn-bg:#3A2E10; --rest:#F4A877; --rest-bg:#42230F;
    --lock:#FF8D9B; --lock-bg:#45161E; --rev:#B99BFF; --rev-bg:#2C1F51; --off:#A9B7C8; --off-bg:#243044;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1224; --surface:#141C33; --surface2:#19223B; --ink:#E8EDF8; --ink2:#B4BFD6; --muted:#8B98B3;
  --line:#26314F; --line2:#1E2843; --brand:#7C8BFF; --brand-ink:#0C1224; --brand-soft:#232C5A;
  --side:#0A1030; --side-ink:#9FACD3;
  --ok:#6FD3A0; --ok-bg:#15382A; --warn:#F0C05A; --warn-bg:#3A2E10; --rest:#F4A877; --rest-bg:#42230F;
  --lock:#FF8D9B; --lock-bg:#45161E; --rev:#B99BFF; --rev-bg:#2C1F51; --off:#A9B7C8; --off-bg:#243044;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;padding:4px 8px 16px}
.logo .mark{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo .mark i{display:block;width:9px;height:15px;border:2px solid #fff;border-radius:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-line);color:#fff}
.nav a.on{background:var(--side-act);color:#fff}
.nav .badge{margin-left:auto;background:#fff;color:var(--side);border-radius:999px;font-size:12px;font-weight:700;padding:0 7px}
.side .grow{flex:1}
.clockbox{border:1px solid var(--side-line);border-radius:12px;padding:10px 12px;font-size:13px}
.clockbox b{color:#fff;font-size:14px}
.clockbox .row2{display:flex;gap:6px;margin-top:8px}
.clockbox button{flex:1;background:var(--side-line);color:#fff;border:0;border-radius:8px;padding:5px 0;cursor:pointer}
.clockbox button:hover{background:var(--side-act)}
.clockbox small{display:block;margin-top:6px;opacity:.75;line-height:1.35}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px 0;color:#fff}
.me .who{min-width:0;flex:1;line-height:1.25}
.me .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:12.5px;color:var(--side-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.iconbtn{background:none;border:0;color:inherit;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{background:var(--side-line)}
.main{min-width:0}
.bar{display:flex;align-items:center;gap:12px;padding:16px 28px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.search{flex:1;max-width:460px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.page{padding:6px 28px 60px;max-width:1280px}
.banner{margin:0 28px 10px;padding:9px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--lock);border-color:var(--lock)}
.btn.danger.solid{background:var(--lock);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:400;color:var(--ink)}
label.chk input{width:auto;margin-top:3px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s-current{background:var(--ok-bg);color:var(--ok)}
.s-grace{background:var(--warn-bg);color:var(--warn)}
.s-restricted{background:var(--rest-bg);color:var(--rest)}
.s-locked{background:var(--lock-bg);color:var(--lock)}
.s-review{background:var(--rev-bg);color:var(--rev)}
.s-paid_off,.s-stock{background:var(--off-bg);color:var(--off)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,26,51,.12)}

/* layout bits */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 18px}
.ph p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.flush{padding:0;overflow:hidden}
.card h2{margin-bottom:12px}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 0}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi span{color:var(--muted);font-size:13.5px}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.kpi small{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{max-width:280px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface2)}
.who2{display:flex;align-items:center;gap:11px;min-width:0}
.who2 div b{display:block;font-weight:600}
.who2 div span{display:block;color:var(--muted);font-size:13px}
.who2 .lnk{white-space:nowrap}
.nw{white-space:nowrap}
.lnk{text-decoration:none;font-weight:600}
.lnk:hover{text-decoration:underline}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av0{background:#E3E8FF;color:#2A3AB8}.av1{background:#DAF1E4;color:#14764A}.av2{background:#FBEBC3;color:#855700}
.av3{background:#F8D3D8;color:#A3182A}.av4{background:#E6DAF8;color:#5A2AB3}.av5{background:#D5EEF4;color:#0F6075}
.avd{width:34px;height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.prog{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}
.muted{color:var(--muted)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}
.attn{list-style:none;margin:0;padding:6px 0}
.attn li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line2)}
.attn li:first-child{border-top:0}
.attn .t{flex:1;min-width:0}
.attn .t b{font-weight:600}
.attn .t span{display:block;color:var(--muted);font-size:13.5px}
.age{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line2);margin:8px 0 14px}
.age i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:10px;padding:5px 0}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .amt{margin-left:auto;font-weight:600}
.bars{width:100%;height:auto;display:block}
.bars text{fill:var(--muted);font-size:10px;font-family:"Hanken Grotesk",sans-serif}
.bars rect.b{fill:var(--brand)}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 18px;border-top:1px solid var(--line2);font-size:14px}
.feed li:first-child{border-top:0}
.feed .d{color:var(--muted)}
.feed .by{color:var(--muted);font-size:12.5px}

/* device page */
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;margin-top:6px}
.crumb:hover{color:var(--ink)}
.dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin:10px 0 16px}
.dh .ttl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dh .sub{color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:30;box-shadow:0 12px 30px rgba(15,26,51,.18)}
details.menu .pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:500}
details.menu .pop button:hover{background:var(--surface2)}
details.menu .pop button.danger{color:var(--lock)}
details.menu .pop hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
.rail{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:4px}
.rail .line{position:absolute;left:12.5%;right:12.5%;top:10px;height:6px;border-radius:99px;background:var(--line2)}
.rail .fill{position:absolute;left:12.5%;top:10px;height:6px;border-radius:99px;background:var(--ok)}
.rail.w1 .fill{background:var(--bar1)}.rail.w2 .fill{background:var(--bar2)}.rail.w3 .fill{background:var(--bar3)}
.rail .nd{position:relative;text-align:center;z-index:1;padding:0 6px}
.rail .dot{width:26px;height:26px;border-radius:50%;margin:0 auto;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center}
.rail .nd.reached .dot{border-color:var(--ok);background:var(--ok)}
.rail .nd.reached.n1 .dot{border-color:var(--bar1);background:var(--bar1)}
.rail .nd.reached.n2 .dot{border-color:var(--bar2);background:var(--bar2)}
.rail .nd.reached.n3 .dot{border-color:var(--bar3);background:var(--bar3)}
.rail.pad{padding-top:46px}
.rail.pad .line,.rail.pad .fill{top:56px}
.rail.pad .mk{top:8px}
.rail .nd.cur .dot{box-shadow:0 0 0 5px var(--brand-soft)}
.rail .nd b{display:block;margin-top:8px;font-weight:600}
.rail .nd span{display:block;color:var(--muted);font-size:13px}
.rail .mk{position:absolute;top:-24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;z-index:2}
.rail .mk::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.flag{border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.flag.rev{background:var(--rev-bg);color:var(--rev);border-color:transparent}
.dgrid{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:16px;align-items:start}
.phone{width:216px;height:420px;border-radius:36px;background:#0b0f16;padding:9px;margin:4px auto 0;box-shadow:0 0 0 2px #2a3447 inset}
.screen{width:100%;height:100%;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;padding:34px 14px 14px;color:#fff;font-size:13px}
.screen.ok{background:linear-gradient(170deg,#1d3a6b,#0f1d38)}
.screen.warn{background:linear-gradient(170deg,#5b4713,#211a08)}
.screen.rest{background:linear-gradient(170deg,#63300f,#22110a)}
.screen.lock{background:#1c0b10}
.screen.off{background:linear-gradient(170deg,#2c3a4a,#141b24)}
.screen .time{font-size:42px;font-weight:600;text-align:center;letter-spacing:-.03em;font-family:"Bricolage Grotesque",sans-serif}
.screen .date{text-align:center;opacity:.75;margin-bottom:16px}
.screen .bn{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 11px;font-size:12.5px;line-height:1.4}
.lockicon{width:30px;height:24px;border-radius:5px;background:#ff8d9b;margin:10px auto 0;position:relative}
.lockicon::before{content:"";position:absolute;left:5px;top:-14px;width:14px;height:14px;border:3px solid #ff8d9b;border-bottom:0;border-radius:9px 9px 0 0}
.screen .emg{margin-top:auto;text-align:center;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px;font-size:12.5px}
.cap{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sumline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2)}
.sumline:last-child{border-bottom:0}
.sumline.big{font-weight:700;font-size:15px}
.tabs{padding:12px 18px 0}
.logline{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 18px;border-top:1px solid var(--line2);font-size:14px}

/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:var(--side);color:#fff;padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.hero .logo{padding:0}
.hero h1{font-size:44px;line-height:1.08;font-weight:600;max-width:15ch;letter-spacing:-.025em}
.hero p{color:var(--side-ink);max-width:46ch;font-size:16px;margin:16px 0 0}
.hero .rail{margin-top:34px;max-width:560px}
.hero .rail .line{background:rgba(255,255,255,.16)}
.hero .rail .dot{background:var(--side);border-color:rgba(255,255,255,.25)}
.hero .rail .nd span{color:var(--side-ink)}
.hero .rail .nd b{color:#fff}
.authform{display:grid;place-items:center;padding:40px 24px;background:var(--bg)}
.authbox{width:100%;max-width:400px}
.authbox h2{font-size:26px;margin-bottom:6px}
.authbox form,.authbox .stack{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.err{color:var(--lock);font-size:13.5px;min-height:20px}
.fine{color:var(--muted);font-size:13px}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0}

/* id capture */
.idgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.idtile{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.idtile.has{border-style:solid;background:var(--surface)}
.idprev{aspect-ratio:3/2;border-radius:8px;background:var(--line2);display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden;text-align:center}
.idprev img{width:100%;height:100%;object-fit:cover;display:block}
.idcap{font-size:13px;line-height:1.35}.idcap b{display:block;font-size:14px}
.idbtns{display:flex;gap:6px;flex-wrap:wrap}
.idbtns label{cursor:pointer}
.idthumbs{display:flex;gap:8px;margin:10px 0}
.idthumb{border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;width:84px;height:56px;cursor:pointer;background:var(--line2)}
.idthumb:hover{border-color:var(--brand)}
.idthumb img{width:100%;height:100%;object-fit:cover;display:block}
.idbig{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,16,40,.5);z-index:80;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:720px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.mbody{padding:8px 20px 14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.preview{background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.preview .sumline{border-color:rgba(51,71,255,.15)}
.merr{color:var(--lock);font-size:13.5px;min-height:18px}
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 16px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:340px}

@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px}
  .logo{padding:0 8px 0 0}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}
  .nav a span.t{display:inline}
  .side .grow,.clockbox{display:none}
  .me{margin-left:auto;padding:0}.me .who{display:none}
  .kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2,.dgrid,.twocol,.grid3{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}.hero{padding:28px 24px}.hero h1{font-size:32px}
  .bar{flex-wrap:wrap}.search{flex:1 1 180px;max-width:none}.bar>span{display:none}
  table{min-width:680px}
  .bar,.page{padding-left:16px;padding-right:16px}.banner{margin:0 16px 10px}
  .rail .nd span{font-size:12px}
}
@media (max-width:620px){.idgrid{grid-template-columns:1fr}}
@media (max-width:520px){.mgrid{grid-template-columns:1fr}.rail .nd b{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Storage, time, formatting
   ===================================================================== */
const mem = {};
let persistent = true;
try { localStorage.setItem('fp:t', '1'); localStorage.removeItem('fp:t'); } catch (e) { persistent = false; }
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return k in mem ? JSON.parse(mem[k]) : null; } },
  set(k, v){ const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch (e) { mem[k] = s; } },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; }
};
const realDay = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
let CLOCK = null, U = null, D = null, ACTOR = 'System';
const today = () => CLOCK != null ? CLOCK : realDay() + (D ? D.offset : 0);
const dd = d => new Date(d * 864e5);
const fmt = (d, o) => dd(d).toLocaleDateString('en-GB', Object.assign({timeZone:'UTC', month:'short', day:'numeric'}, o || {}));
const fmtY = d => fmt(d, {year:'numeric'});
const fmtLong = d => fmt(d, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
const rel = d => { const n = d - today(); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? 'in ' + n + ' days' : (-n) + ' days ago'; };
const money = c => { const neg = c < 0; c = Math.abs(c); return (neg ? '−' : '') + 'GH₵' + (c / 100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); };
const money0 = c => (c < 0 ? '−' : '') + 'GH₵' + Math.round(Math.abs(c) / 100).toLocaleString('en-US');
const cents = s => Math.round(parseFloat(String(s).replace(/[^0-9.]/g, '') || '0') * 100);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rnd = (n, a) => { a = a || 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; let s = ''; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const hue = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 6; return h; };
const $ = id => document.getElementById(id);

const GH_NETS = {MTN:['024','054','055','059','025','053'], Telecel:['020','050'], AT:['026','056','027','057']};
const NET_LABEL = {MTN:'MTN MoMo', Telecel:'Telecel Cash', AT:'AT Money'};
function ghPhone(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if (d.startsWith('233') && d.length === 12) d = '0' + d.slice(3); else if (d.length === 9) d = '0' + d;
  if (!/^0\d{9}$/.test(d)) return {ok:false};
  let net = null; for (const k in GH_NETS) if (GH_NETS[k].includes(d.slice(0, 3))) net = NET_LABEL[k];
  return {ok:true, disp:d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6), e164:'+233' + d.slice(1), net};
}
const MODELS = [
  {name:'iPhone 16e 128GB',        price:950000,  cost:810000},
  {name:'iPhone 17 256GB',         price:1450000, cost:1230000},
  {name:'iPhone Air 256GB',        price:1800000, cost:1530000},
  {name:'iPhone 17 Pro 256GB',     price:2000000, cost:1700000},
  {name:'iPhone 17 Pro Max 256GB', price:2300000, cost:1950000}
];
const modelInfo = n => MODELS.find(m => m.name === n);

const PAY_OTHER = ['Card', 'Bank transfer', 'Cash'];
const COA = {
  '1000':{n:'Cash', t:'asset'}, '1100':{n:'Installment receivables', t:'asset'}, '1200':{n:'Device inventory', t:'asset'},
  '2100':{n:'Unearned finance income', t:'liab'}, '3000':{n:'Owner equity', t:'equity'},
  '4000':{n:'Device sales', t:'rev'}, '4100':{n:'Finance income', t:'rev'},
  '5000':{n:'Cost of devices sold', t:'exp'}, '6000':{n:'Operating expenses', t:'exp'}, '6100':{n:'Bad debt expense', t:'exp'}, '6200':{n:'Payment processing fees', t:'exp'}
};

/* =====================================================================
   Auth
   ===================================================================== */
async function hashPw(pw, salt){
  try {
    const enc = new TextEncoder();
    const k = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256'}, k, 256);
    return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; const s = salt + pw;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'x' + h;
  }
}
const users = () => store.get('fp:users') || [];

function newWorkspace(user){
  return {v:1, company:user.company, offset:0, lastTick:realDay(), seq:{device:1, account:1, entry:1, event:1},
    settings:{restrictAt:4, warnAt:7, lockAt:10, noticeDays:2, requireApproval:true, supportPhone:'0800 000 142', feePct:6, cadence:14, autoRequest:true, procFee:1.95,
      lockMessage:'This iPhone is locked because a payment is overdue. Call {phone} to pay and unlock it.'},
    devices:[], accounts:[], ledger:[], events:[], mdm:[]};
}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { if (U && D) store.set('fp:ws:' + U.id, D); }, 120); }
function saveNow(){ clearTimeout(saveT); if (U && D) store.set('fp:ws:' + U.id, D); }

async function doSignUp(){
  const v = { name:$('su-name').value.trim(), company:$('su-co').value.trim(), email:$('su-email').value.trim().toLowerCase(), pw:$('su-pw').value, demo:$('su-demo').checked };
  const err = m => { $('auth-err').textContent = m; return; };
  if (!v.name || !v.company) return err('Enter your name and company.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return err('Enter a valid email address.');
  if (v.pw.length < 8) return err('Use a password with at least 8 characters.');
  if (users().some(u => u.email === v.email)) return err('An account with this email already exists. Sign in instead.');
  const salt = rnd(16, 'abcdef0123456789');
  const user = {id:'u' + Date.now().toString(36) + rnd(3, 'abcdefghij'), name:v.name, company:v.company, email:v.email, salt, hash:await hashPw(v.pw, salt)};
  store.set('fp:users', users().concat([user]));
  openSession(user);
  if (v.demo) seedDemo();
  saveNow(); location.hash = 'overview'; render();
}
async function doSignIn(){
  const email = $('si-email').value.trim().toLowerCase(), pw = $('si-pw').value;
  const u = users().find(x => x.email === email);
  if (!u || (await hashPw(pw, u.salt)) !== u.hash) { $('auth-err').textContent = 'Email or password is incorrect.'; return; }
  openSession(u); location.hash = 'overview'; render();
}
function openSession(user){
  U = user; store.set('fp:session', user.id);
  D = store.get('fp:ws:' + user.id) || newWorkspace(user);
  D.settings = Object.assign({autoRequest:true, procFee:1.95}, D.settings);
  ui.sel = new Set();
  catchUp(); saveNow();
}
function signOut(){ authMode = 'in'; saveNow(); for (const k in IMGS) delete IMGS[k]; store.del('fp:session'); U = null; D = null; render(); }

/* =====================================================================
   Domain: ledger, devices, accounts
   ===================================================================== */
const dev = id => D.devices.find(d => d.id === id);
const acct = d => d.accountId ? D.accounts.find(a => a.id === d.accountId) : null;
const aOf = a => dev(a.deviceId);
const oldest = a => a.inst.find(i => i.paid < i.amt) || null;
const remaining = a => sum(a.inst, i => i.amt - i.paid);
const unearned = a => sum(a.inst, i => i.fee - i.feeRec);
const lateDays = a => { const u = oldest(a); return u ? today() - u.due : -999; };
const pastDue = a => sum(a.inst.filter(i => i.due < today()), i => i.amt - i.paid);

function ev(kind, text, o){
  o = o || {};
  D.events.push({id:D.seq.event++, day:today(), kind, text, actor:o.actor || ACTOR, accountId:o.a ? o.a.id : null, deviceId:o.d ? o.d.id : (o.a ? o.a.deviceId : null)});
  if (D.events.length > 3000) D.events.splice(0, 500);
}
function plainAction(m){
  const c = m.cmd, dt = m.detail || '';
  if (c === 'DeviceConfigured') return 'Phone set up and ready to finance';
  if (c === 'InstallProfile') return /restrict/i.test(dt) ? 'Limited some phone features' : 'Phone linked to the customer’s account';
  if (c === 'RemoveProfile') return /supervis/i.test(dt) ? null : 'Restored phone features';
  if (c === 'EnableLostMode') return 'Locked the phone';
  if (c === 'DisableLostMode') return 'Unlocked the phone';
  if (c === 'DeviceInformation') return 'Checked phone status';
  if (c === 'ReleaseFromABM') return 'Released the phone to the customer';
  return 'Updated the phone';
}
/* Every phone action is sent to the device-management service (simulated here) and logged. The log is kept in the background. */
const MDM = {
  send(d, cmd, detail){
    D.mdm.push({id:rnd(8, '0123456789abcdef'), day:today(), deviceId:d.id, serial:d.serial, cmd, detail, actor:ACTOR});
    if (D.mdm.length > 3000) D.mdm.splice(0, 500);
  }
};
function post(memo, lines, ref){
  const dr = sum(lines, l => l[1] || 0), cr = sum(lines, l => l[2] || 0);
  if (dr !== cr) throw new Error('Unbalanced journal entry: ' + dr + ' vs ' + cr);
  D.ledger.push({id:D.seq.entry++, day:today(), memo, ref:ref || {}, lines:lines.filter(l => l[1] || l[2]).map(l => ({c:l[0], dr:l[1] || 0, cr:l[2] || 0}))});
}
function balances(){ const b = {}; for (const c in COA) b[c] = 0; for (const e of D.ledger) for (const l of e.lines) b[l.c] += l.dr - l.cr; return b; }

function addFunds(amt, memo){ post(memo || 'Owner funds added', [['1000', amt, 0], ['3000', 0, amt]], {type:'funds'}); ev('books', 'Added ' + money(amt) + ' of owner funds.'); }
function addExpense(amt, memo){ post(memo || 'Operating expense', [['6000', amt, 0], ['1000', 0, amt]], {type:'expense'}); ev('books', 'Recorded expense: ' + money(amt) + ' for ' + (memo || 'operations') + '.'); }
function buyStock(model, qty, unitCost, serials){
  const made = [];
  for (let i = 0; i < qty; i++) {
    const d = {id:D.seq.device++, model, serial:(serials && serials[i]) || 'F' + rnd(10), imei:rnd(15, '0123456789'), cost:unitCost,
      status:'stock', accountId:null, added:today(), lastSeen:today(), battery:60 + Math.floor(Math.random() * 40), os:'iOS 26.1', flag:null,
      dev:{supervised:true, restricted:false, lost:false}, alBypass:'ALBC-' + rnd(4) + '-' + rnd(4)};
    D.devices.push(d); made.push(d);
    MDM.send(d, 'DeviceConfigured', 'Assigned in Apple Business Manager and enrolled with a supervised profile');
  }
  post('Bought ' + qty + ' × ' + model, [['1200', qty * unitCost, 0], ['1000', 0, qty * unitCost]], {type:'stock'});
  ev('stock', 'Added ' + qty + ' × ' + model + ' to stock at ' + money(unitCost) + ' each.');
  return made;
}
function originate(o){
  const d = dev(o.deviceId), principal = o.price - o.down, fee = Math.round(principal * o.feePct / 100), total = principal + fee, n = o.n;
  const base = Math.floor(total / n), feeBase = Math.floor(fee / n);
  const inst = [];
  for (let k = 0; k < n; k++) inst.push({n:k + 1, due:today() + o.cadence * (k + 1), amt:k === n - 1 ? total - base * (n - 1) : base,
    fee:k === n - 1 ? fee - feeBase * (n - 1) : feeBase, paid:0, feeRec:0, doneDay:null});
  const a = {id:D.seq.account++, deviceId:d.id, customer:o.customer, price:o.price, down:o.down, principal, fee, total, n, cadence:o.cadence, start:today(),
    inst, status:'active', stage:'current', warnDay:null, approved:false, pendingReview:false, holdUntil:-1e9, manual:null, sent:{}};
  d.status = 'financed'; d.accountId = a.id; d.flag = null; d.dev = {supervised:true, restricted:false, lost:false};
  D.accounts.push(a);
  post('Financing opened for ' + o.customer.name + ': ' + d.model,
    [['1000', o.down, 0], ['1100', total, 0], ['4000', 0, o.price], ['2100', 0, fee], ['5000', d.cost, 0], ['1200', 0, d.cost]], {type:'origination', a:a.id, d:d.id});
  MDM.send(d, 'InstallProfile', 'Fleetpay management profile bound to account #' + a.id);
  ev('account', 'Account opened for ' + o.customer.name + ': ' + money(o.price) + ' phone, ' + money(o.down) + ' down, ' + n + ' payments of about ' + money(base) + '.', {a, d});
  return a;
}
function recordPayment(a, amount, method){
  const d = aOf(a);
  let left = Math.min(amount, remaining(a)); if (left <= 0) return 0;
  const applied = left; let feeRec = 0;
  for (const i of a.inst) {
    if (left <= 0) break;
    const owe = i.amt - i.paid; if (owe <= 0) continue;
    const chunk = Math.min(owe, left); i.paid += chunk; left -= chunk;
    const fr = i.paid >= i.amt ? i.fee - i.feeRec : Math.min(i.fee - i.feeRec, Math.round(i.fee * chunk / i.amt));
    i.feeRec += fr; feeRec += fr;
    if (i.paid >= i.amt) i.doneDay = today();
  }
  const pf = PAY_OTHER.slice(1).includes(method) ? 0 : Math.round(applied * (D.settings.procFee || 0) / 100);
  post('Payment from ' + a.customer.name + ' (' + method + ')', [['1000', applied - pf, 0], ['6200', pf, 0], ['1100', 0, applied], ['2100', feeRec, 0], ['4100', 0, feeRec]], {type:'payment', a:a.id, d:d.id, method, amount:applied, fee:pf});
  (a.requests || []).forEach(q => { if (q.status === 'pending') q.status = 'paid'; });
  ev('payment', 'Payment received: ' + money(applied) + ' by ' + method + '. Balance ' + money(remaining(a)) + '.', {a, d});
  if (remaining(a) === 0) {
    a.status = 'paid_off'; a.stage = 'paid_off'; a.pendingReview = false; a.manual = null; d.status = 'paid_off'; d.flag = null;
    if (d.dev.lost) MDM.send(d, 'DisableLostMode', 'Device unlocked');
    if (d.dev.restricted) MDM.send(d, 'RemoveProfile', 'Restrictions payload removed');
    MDM.send(d, 'RemoveProfile', 'Supervision profile removed');
    MDM.send(d, 'ReleaseFromABM', 'Serial released from Apple Business Manager');
    d.dev = {supervised:false, restricted:false, lost:false};
    ev('device', 'Paid in full. Phone released to the customer.', {a, d});
  } else evaluate(a);
  return applied;
}
function writeOff(a, recovered){
  const d = aOf(a), R = remaining(a), Un = unearned(a);
  recovered = Math.max(0, Math.min(recovered, R - Un));
  const loss = R - Un - recovered;
  post('Write-off: ' + a.customer.name + ' (' + d.model + ')', [['1200', recovered, 0], ['6100', loss, 0], ['2100', Un, 0], ['1100', 0, R]], {type:'writeoff', a:a.id, d:d.id});
  a.status = 'written_off'; a.stage = recovered > 0 ? 'current' : 'locked'; a.pendingReview = false; a.manual = null;
  if (recovered > 0) {
    d.status = 'returned'; d.cost = recovered; d.flag = null;
    if (d.dev.lost) MDM.send(d, 'DisableLostMode', 'Device recovered and reset for resale');
    if (d.dev.restricted) MDM.send(d, 'RemoveProfile', 'Restrictions payload removed');
    d.dev = {supervised:true, restricted:false, lost:false};
  } else {
    d.status = 'written_off';
    if (!d.dev.restricted) { MDM.send(d, 'InstallProfile', 'Restrictions payload applied'); d.dev.restricted = true; }
    if (!d.dev.lost) { MDM.send(d, 'EnableLostMode', 'Locked after write-off; emergency calls stay available'); d.dev.lost = true; }
  }
  ev('account', 'Account written off. Loss ' + money(loss) + (recovered > 0 ? ', device recovered at ' + money(recovered) + '.' : ', device stays locked.'), {a, d});
}

/* ---------- payment requests (mobile money prompts) ---------- */
function pendingReq(a){ return (a.requests || []).find(q => q.status === 'pending') || null; }
function sendRequest(a, amount, auto){
  const c = a.customer; if (!c.momo || pendingReq(a)) return null;
  a.requests = a.requests || [];
  const r = {id:rnd(6, '0123456789abcdef'), day:today(), amount, net:c.momo.net, status:'pending', auto:!!auto};
  a.requests.push(r); if (a.requests.length > 30) a.requests.shift();
  ev('payment', (auto ? 'Payment request sent automatically' : 'Payment request sent') + ': ' + money(amount) + ' to ' + c.momo.net + ' ' + c.momo.disp + '. Waiting for approval.', {a});
  return r;
}
const REQ_REASON = {declined:'the customer declined it', nofunds:'not enough money in the wallet', noresponse:'no response from the customer', expired:'it expired without approval'};
function resolveRequest(a, r, outcome){
  if (!r || r.status !== 'pending') return;
  if (outcome === 'approved') { r.status = 'paid'; recordPayment(a, r.amount, r.net); return; }
  r.status = outcome === 'expired' ? 'expired' : 'failed'; r.reason = outcome;
  ev('payment', 'Payment request of ' + money(r.amount) + ' did not go through: ' + REQ_REASON[outcome] + '.', {a});
}

/* ---------- enforcement ---------- */
const RANK = {current:0, grace:1, restricted:2, locked:3};
const STAGE = {current:'Current', grace:'Past due', restricted:'Restricted', locked:'Locked'};
function setStage(a, d, want){
  const nr = RANK[want] >= 2, nl = want === 'locked';
  if (nr && !d.dev.restricted) { MDM.send(d, 'InstallProfile', 'Restrictions payload applied (non‑essential features limited)'); d.dev.restricted = true; }
  if (nl && !d.dev.lost) { MDM.send(d, 'EnableLostMode', 'Lock message and support number shown; emergency calls stay available'); d.dev.lost = true; }
  if (!nl && d.dev.lost) { MDM.send(d, 'DisableLostMode', 'Device unlocked'); d.dev.lost = false; }
  if (!nr && d.dev.restricted) { MDM.send(d, 'RemoveProfile', 'Restrictions payload removed'); d.dev.restricted = false; }
  if (a.stage !== want) {
    let why = '';
    if (want === 'locked') why = d.flag === 'lost' ? ' (reported lost)' : a.manual === 'locked' ? ' (manual lock)' : ' (missed payments)';
    const msgs = {current:'Back to current. Phone fully unlocked.', grace:'Account is past due. Notices only.', restricted:'Phone features restricted.', locked:'Phone locked' + why + '.'};
    ev('device', msgs[want], {a, d}); a.stage = want;
  }
}
function evaluate(a){
  if (a.status !== 'active') return;
  const P = D.settings, d = aOf(a), late = lateDays(a), t = today();
  if (late < P.warnAt) { a.warnDay = null; a.approved = false; }
  let want = 'current';
  if (late >= 1 && late < P.restrictAt) want = 'grace'; else if (late >= P.restrictAt) want = 'restricted';
  a.pendingReview = false;
  if (late >= P.lockAt) {
    const ok = a.warnDay != null && t - a.warnDay >= P.noticeDays;
    if (ok) { if (!P.requireApproval || a.approved) want = 'locked'; else a.pendingReview = true; }
  }
  if (t <= a.holdUntil && RANK[want] >= 2) want = 'grace';
  if (a.manual === 'restricted' && RANK[want] < 2) want = 'restricted';
  if (a.manual === 'locked' || d.flag === 'lost') want = 'locked';
  setStage(a, d, want);
}
function notify(a, key, text){ if (a.sent[key]) return; a.sent[key] = 1; ev('notice', text, {a}); }
function tickDay(){
  const P = D.settings, t = today();
  for (const a of D.accounts) {
    if (a.status !== 'active') continue;
    (a.requests || []).forEach(q => { if (q.status === 'pending' && q.day < t) resolveRequest(a, q, 'expired'); });
    const u = oldest(a);
    if (u) {
      const late = t - u.due, owe = money(u.amt - u.paid);
      if ((late === 0 || late === 3) && P.autoRequest !== false && a.customer.momo && !pendingReq(a)) sendRequest(a, u.amt - u.paid, true);

      if (late >= P.restrictAt) notify(a, 'rest' + u.n, 'SMS and push to ' + a.customer.name + ': some features are limited until ' + owe + ' is paid.');

async function compressImage(file){
  if (!file.type || !file.type.startsWith('image/')) throw new Error('Choose a photo or an image file.');
  if (file.size > 25 * 1024 * 1024) throw new Error('That file is over 25 MB. Choose a smaller photo.');
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('That image could not be read. Try another photo.')); im.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, sc = Math.min(1, 1100 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
  return {url:c.toDataURL('image/jpeg', 0.72), w:c.width, h:c.height};
}

/* ---------- accounting ---------- */
function cashFlow(){
  const r = {funds:0, down:0, pay:0, stock:0, exp:0};
  for (const e of D.ledger) {
    const cl = e.lines.find(l => l.c === '1000'); if (!cl) continue;
    const amt = cl.dr - cl.cr, t = e.ref && e.ref.type;
    if (t === 'funds') r.funds += amt; else if (t === 'origination') r.down += amt; else if (t === 'payment') r.pay += amt;
    else if (t === 'stock') r.stock -= amt; else if (t === 'expense') r.exp -= amt;
  }
  return r;
}

  return '<div class="age" role="img" aria-label="Money owed, by how late it is">' + ag.map((v, i) => '<i style="width:' + (v / tot * 100) + '%;background:' + cols[i] + '"></i>').join('') + '</div>'
    + '<ul class="legend">' + ag.map((v, i) => '<li><span class="dot" style="background:' + cols[i] + '"></span>' + names[i] + '<span class="amt">' + money(v) + '</span></li>').join('') + '</ul>';

function railHTML(a){

  if (late > 0) { pct = 100; for (let i = 1; i < pts.length; i++) if (late <= pts[i][0]) { const a0 = pts[i - 1], a1 = pts[i]; pct = a0[1] + (a1[1] - a0[1]) * ((late - a0[0]) / Math.max(1, a1[0] - a0[0])); break; } }
  const nodes = [{t:'Current', s:late >= 1 ? 'Back here when paid' : 'On schedule'}, {t:'Past due', s:'Day 1, ' + fmt(due + 1)}, {t:'Restricted', s:'Day ' + P.restrictAt + ', ' + fmt(due + P.restrictAt)}, {t:'Locked', s:'Day ' + P.lockAt + ', ' + fmt(due + P.lockAt)}];

      + fld('Number of payments', '<select name="n">' + [3, 4, 6, 9, 12, 18, 24].map(x => '<option' + (x === 6 ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>')
      + fld('Payment interval', '<select name="cad"><option value="7"' + (P.cadence === 7 ? ' selected' : '') + '>Weekly</option><option value="14"' + (P.cadence === 14 ? ' selected' : '') + '>Every 2 weeks</option><option value="30"' + (P.cadence === 30 ? ' selected' : '') + '>Monthly</option></select>')
      + fld('Finance fee (%)', '<input name="fee" inputmode="decimal" value="' + P.feePct + '">') + '</div>'
      + '<div class="preview" id="pv"></div>'
      + '<h3 style="margin-top:4px">Customer ID</h3><div class="mgrid">' + idTypeSel() + fld('Last 4 characters of ID number', '<input name="idlast" maxlength="4" autocomplete="off">') + '</div>' + idGridHTML()
      + '<label class="chk"><input type="checkbox" name="idok">I’ve compared the ID photos to the customer in person and the details above match.</label>'
      + '<label class="chk"><input type="checkbox" name="consent">The customer has agreed in writing that the phone can be restricted or locked after missed payments, as described in the agreement.</label>',
    onInput(v){
      $('pv').innerHTML = termsPreview(v);
      const m = ghPhone(v.momo || v.phone), h = $('momohint');
      if (h) h.textContent = !(v.momo || v.phone) ? 'Payment requests go to this wallet.' : !m.ok ? 'Enter a 10-digit Ghana number, like 024 412 0134.' : m.net ? 'Detected: ' + m.net : 'Network not recognized. Check the number.';
    },
    onOk(v){
      if (!v.name.trim()) return 'Enter the customer’s name.';
      const gp = ghPhone(v.phone), gm = ghPhone(v.momo || v.phone);
      if (!gp.ok) return 'Enter a valid Ghana mobile number, like 024 412 0134.';
      if (!gm.ok || !gm.net) return 'Enter the customer’s mobile money number. It should start with a MTN, Telecel or AT prefix.';
      const price = cents(v.price), down = cents(v.down);
      if (price <= 0) return 'Enter the phone price.';
      if (down < 0 || down >= price) return 'The down payment must be less than the price.';
      if (!PEND.front) return 'Add a photo of the front of the customer’s ID.';
      if (!/^[A-Za-z0-9]{4}$/.test(v.idlast.trim())) return 'Enter the last 4 characters of the ID number.';
      if (!v.idok || !v.consent) return 'Confirm the ID check and the customer’s written consent.';
      let aid;
      const idobj = {type:v.idtype, last4:v.idlast.trim().toUpperCase(), front:putImg(PEND.front.url), back:PEND.back ? putImg(PEND.back.url) : null, selfie:PEND.selfie ? putImg(PEND.selfie.url) : null, day:today(), by:U.name};
      act(() => { const a = originate({customer:{name:v.name.trim(), phone:gp.disp, momo:{net:gm.net, disp:gm.disp}, email:v.email.trim(), idChecked:true, id:idobj}, deviceId:+v.dev, price, down, feePct:parseFloat(v.fee) || 0, n:+v.n, cadence:+v.cad}); aid = a.deviceId; });
      closeModal(); location.hash = 'device-' + aid; toast('Account opened for ' + v.name.trim() + '.'); return false;
    }});
  // keep price in sync with selected phone
  const sel = $('modal-root').querySelector('[name=dev]');
  sel.addEventListener('change', () => { const d = dev(+sel.value), m = modelInfo(d.model); $('modal-root').querySelector('[name=price]').value = (m ? m.price : Math.round(d.cost * 1.2)) / 100; MODAL.onInput(modalVals()); });
}
function addStockModal(){
  openModal({title:'Add stock', ok:'Add to stock',
    body:fld('Model', '<select name="model">' + MODELS.map(m => '<option>' + m.name + '</option>').join('') + '</select>')
      + '<div class="mgrid">' + fld('Quantity', '<input name="qty" type="number" min="1" max="200" value="5">') + fld('Unit cost (GH₵)', '<input name="cost" inputmode="decimal" value="' + MODELS[0].cost / 100 + '">') + '</div>'
      + fld('Serial numbers (optional)', '<textarea name="serials" placeholder="One per line. Leave blank to generate."></textarea>', 'Copy these from your supplier’s invoice or packing list.'),
    onOk(v){
      const qty = Math.max(0, parseInt(v.qty, 10) || 0), cost = cents(v.cost);
      if (qty < 1 || qty > 200) return 'Enter a quantity between 1 and 200.'; if (cost <= 0) return 'Enter the unit cost.';
      const serials = v.serials.split('\n').map(s => s.trim()).filter(Boolean);
      if (serials.length && serials.length !== qty) return 'You entered ' + serials.length + ' serials for ' + qty + ' phones.';
      if (serials.some(s => D.devices.some(d => d.serial === s))) return 'One of those serial numbers is already in your fleet.';
      act(() => buyStock(v.model, qty, cost, serials)); closeModal(); toast('Added ' + qty + ' to stock.'); return false;
    }});
  const sel = $('modal-root').querySelector('[name=model]');
  sel.addEventListener('change', () => { $('modal-root').querySelector('[name=cost]').value = modelInfo(sel.value).cost / 100; });
}
function simpleAmountModal(title, label, memoLabel, fn){
  openModal({title, ok:'Save', body:fld(label, '<input name="amt" inputmode="decimal" placeholder="0.00">') + fld(memoLabel, '<input name="memo">'),
    onOk(v){ const c = cents(v.amt); if (c <= 0) return 'Enter an amount.'; act(() => fn(c, v.memo.trim())); closeModal(); toast('Saved.'); return false; }});
}
function reasonModal(title, intro, ok, danger, fn, extra){
  openModal({title, ok, danger, body:'<p style="margin:0;color:var(--ink2)">' + intro + '</p>' + (extra || '') + fld('Reason', '<textarea name="reason" placeholder="Recorded in the activity log"></textarea>'),
    onOk(v){ if (v.reason.trim().length < 3) return 'Add a short reason. It goes in the audit log.'; act(() => fn(v)); closeModal(); return false; }});
}
function ctx(el){ const d = dev(+el.dataset.id); return {d, a:acct(d)}; }

const ACTIONS = {
  go(el, e){ if (e.target.closest('a')) return; location.hash = el.dataset.to; },
  authmode(el){ authMode = el.dataset.m; render(); },
  signin(){ doSignIn(); }, signup(){ doSignUp(); }, signout(){ signOut(); },
  'modal-close'(){ closeModal(); },
  'modal-ok'(){ if (!MODAL) return; const r = MODAL.onOk(modalVals()); if (r) $('merr').textContent = r; else if (r === undefined) closeModal(); },
  adv(el){ advanceDays(+el.dataset.n); },
  newacct(){ newAccountModal(); },
  startfin(el){ newAccountModal(+el.dataset.id); },
  addstock(){ addStockModal(); },
  addfunds(){ simpleAmountModal('Add your own money', 'Amount (GH₵)', 'Note (optional)', (c, m) => addFunds(c, m || 'Owner funds added')); },
  addexpense(){ simpleAmountModal('Add an expense', 'Amount (GH₵)', 'What was it for?', (c, m) => addExpense(c, m || 'Operating expense')); },
  seed(){ openModal({title:'Load sample data', ok:'Replace my data', danger:true, body:'<p style="margin:0">This replaces everything in this workspace with sample customers, devices and books. Your preferences are kept.</p>', onOk(){ act(() => { seedDemo(); }); closeModal(); location.hash = 'overview'; toast('Sample data loaded.'); return false; }}); },
  resetws(){ openModal({title:'Erase all data', ok:'Erase everything', danger:true, body:'<p style="margin:0">This permanently deletes every device, account, ID photo and journal entry in this workspace.</p>', onOk(){ const s = D.settings; delAllImgs(); D = newWorkspace(U); D.settings = s; saveNow(); closeModal(); location.hash = 'overview'; render(); toast('Workspace erased.'); return false; }}); },
  chip(el){ ui.status = el.dataset.k; render(); },
  acctfilter(el){ ui.acctFilter = el.dataset.k; render(); },
  actfilter(el){ ui.actFilter = el.dataset.k; render(); },
  atab(el){ ui.acctTab = el.dataset.k; render(); },
  dtab(el){ ui.devTab = el.dataset.k; render(); },
  selrow(el){ const id = +el.dataset.id; el.checked ? ui.sel.add(id) : ui.sel.delete(id); $('bulk').innerHTML = bulkBar(); },
  selall(el){ const l = filteredDevices(); l.forEach(d => el.checked ? ui.sel.add(d.id) : ui.sel.delete(d.id)); $('devtbl').innerHTML = devicesTable(); $('bulk').innerHTML = bulkBar(); },
  selclear(){ ui.sel.clear(); $('devtbl').innerHTML = devicesTable(); $('bulk').innerHTML = bulkBar(); },
  bulkremind(){ let n = 0; act(() => { ui.sel.forEach(id => { const a = acct(dev(id)); if (a && a.status === 'active') { const u = oldest(a); ev('notice', 'Reminder sent to ' + a.customer.name + ': ' + money(u.amt - u.paid) + (u.due < today() ? ' was due ' : ' is due ') + fmt(u.due) + '.', {a}); n++; } }); }); toast(n + ' reminders sent.'); },
  bulkexport(){ exportCsv('devices-selected.csv', devRows(D.devices.filter(d => ui.sel.has(d.id)))); },
  exportdev(){ exportCsv('devices.csv', devRows(filteredDevices())); },
  exportacct(){ exportCsv('accounts.csv', [['Customer', 'Phone', 'Device', 'Serial', 'Opened', 'Price', 'Down', 'Total owed', 'Paid', 'Balance', 'Status']].concat(D.accounts.map(a => { const d = aOf(a); return [a.customer.name, a.customer.phone, d.model, d.serial, fmtY(a.start), a.price / 100, a.down / 100, a.total / 100, (a.total - remaining(a)) / 100, remaining(a) / 100, a.status]; }))); },
  exportjournal(){ const rows = [['Date', 'Entry', 'Memo', 'Code', 'Account', 'Debit', 'Credit']]; D.ledger.forEach(e => e.lines.forEach(l => rows.push([fmtY(e.day), e.id, e.memo, l.c, COA[l.c].n, l.dr / 100, l.cr / 100]))); exportCsv('journal.csv', rows); },
  exportrecv(){ exportCsv('receivables.csv', [['Customer', 'Device', 'Total owed', 'Paid', 'Past due', 'Outstanding', 'Days late']].concat(D.accounts.filter(a => a.status === 'active').map(a => [a.customer.name, aOf(a).model, a.total / 100, (a.total - remaining(a)) / 100, pastDue(a) / 100, remaining(a) / 100, Math.max(0, lateDays(a))]))); },
  exportpay(){ exportCsv('payments.csv', [['Date', 'Customer', 'Device', 'Method', 'Amount']].concat(payments().map(e => { const a = D.accounts.find(x => x.id === e.ref.a), d = dev(e.ref.d); return [fmtY(e.day), a ? a.customer.name : '', d ? d.model : '', e.ref.method, e.ref.amount / 100]; }))); },
  bypass(el){ const {d} = ctx(el); act(() => ev('device', 'Viewed the Apple ID unlock code.', {d})); ui.reveal = d.id; render(); },
  refresh(el){ const {d} = ctx(el); act(() => { MDM.send(d, 'DeviceInformation', 'Queried battery, OS version and check‑in'); d.lastSeen = today(); d.battery = Math.max(8, Math.min(100, d.battery + Math.floor(Math.random() * 14) - 7)); }); toast('Device status refreshed.'); },
  remind(el){ const {d, a} = ctx(el), u = oldest(a); act(() => ev('notice', 'Reminder sent to ' + a.customer.name + ': ' + money(u.amt - u.paid) + (u.due < today() ? ' was due ' : ' is due ') + fmt(u.due) + '.', {a})); toast('Reminder sent to ' + a.customer.name + '.'); },
  reqpay(el){
    const {d, a} = ctx(el), u = oldest(a), c = a.customer;
    if (pendingReq(a)) { toast('A request is already waiting for approval.'); return; }
    const def = Math.max(pastDue(a), u.amt - u.paid);
    openModal({title:'Request payment', ok:'Send request',
      body:'<p style="margin:0;color:var(--ink2)">' + esc(c.name) + ' gets a prompt on their phone from ' + esc(c.momo.net) + ' (' + esc(c.momo.disp) + ') and approves with their wallet PIN. You’ll see the payment appear here once they do.</p>'
        + '<div class="note">Balance ' + money(remaining(a)) + '. Overdue ' + money(pastDue(a)) + '.</div>' + fld('Amount (GH₵)', '<input name="amt" inputmode="decimal" value="' + (def / 100) + '">'),
      onOk(v){ const x = cents(v.amt); if (x <= 0) return 'Enter an amount.'; if (x > remaining(a)) return 'That is more than the balance of ' + money(remaining(a)) + '.';
        act(() => sendRequest(a, x, false)); closeModal(); toast('Payment request sent to ' + c.name + '.'); return false; }});
  },
  reqres(el){
    const {d, a} = ctx(el), r = pendingReq(a), o = el.dataset.o;
    act(() => resolveRequest(a, r, o));
    toast(o === 'approved' ? 'Payment received.' : 'Request did not go through.');
  },
  pay(el){
    const {d, a} = ctx(el), u = oldest(a);
    openModal({title:'Record payment', ok:'Record payment', body:'<div class="note">Balance ' + money(remaining(a)) + '. Overdue ' + money(pastDue(a)) + '.</div><div class="mgrid">' + fld('Amount (GH₵)', '<input name="amt" inputmode="decimal" value="' + ((u.amt - u.paid) / 100) + '">')
      + fld('Paid by', '<select name="method">' + ((a.customer.momo ? [a.customer.momo.net] : []).concat(PAY_OTHER)).map(o => '<option>' + o + '</option>').join('') + '</select>') + '</div><p class="fine" style="margin:0">Use this for payments you received outside the app, like cash or a bank transfer. Payments go to the oldest unpaid installment first. A phone that’s locked for lateness unlocks as soon as the overdue amount is paid.</p>',
      onOk(v){ const c = cents(v.amt); if (c <= 0) return 'Enter an amount.'; if (c > remaining(a)) return 'That is more than the balance of ' + money(remaining(a)) + '.'; act(() => recordPayment(a, c, v.method)); closeModal(); toast('Payment recorded.'); return false; }});
  },
  locknow(el){ const {d, a} = ctx(el); reasonModal('Lock ' + d.model, 'Locks the phone now. It stays locked until you unlock it, even if the customer is paid up. Emergency calls still work.', 'Lock phone', true, v => { a.manual = 'locked'; ev('admin', 'Manual lock. Reason: ' + v.reason.trim(), {a, d}); evaluate(a); }); },
  restrict(el){ const {d, a} = ctx(el); reasonModal('Restrict features', 'Limits non‑essential features without a full lock.', 'Restrict', false, v => { a.manual = 'restricted'; ev('admin', 'Manual restriction. Reason: ' + v.reason.trim(), {a, d}); evaluate(a); }); },
  unlock(el){ const {d, a} = ctx(el); reasonModal('Unlock ' + d.model, 'Removes manual locks and restrictions. If the account is still overdue, a 3‑day hold keeps the phone usable while the customer pays.', 'Unlock phone', false, v => {
    a.manual = null; a.holdUntil = lateDays(a) >= D.settings.restrictAt ? today() + 3 : -1e9; ev('admin', 'Unlocked by support. Reason: ' + v.reason.trim(), {a, d}); evaluate(a); }); },
  hold(el){ const {d, a} = ctx(el); reasonModal('Place support hold', 'Pauses restrictions and locks for a few days, for example while a customer sets up a payment plan.', 'Place hold', false, v => { a.holdUntil = today() + (+v.days); ev('admin', 'Support hold until ' + fmt(a.holdUntil) + '. Reason: ' + v.reason.trim(), {a, d}); evaluate(a); },
    fld('Hold length', '<select name="days"><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option></select>')); },
  approve(el){ const {d, a} = ctx(el); openModal({title:'Approve lock', ok:'Lock phone', danger:true, body:'<p style="margin:0">' + esc(a.customer.name) + ' is ' + lateDays(a) + ' days late with ' + money(pastDue(a)) + ' overdue. The final notice went out ' + fmt(a.warnDay) + '. The phone will lock now and unlock automatically when the overdue amount is paid.</p>',
    onOk(){ act(() => { a.approved = true; ev('admin', 'Lock approved after review.', {a, d}); evaluate(a); }); closeModal(); return false; }}); },
  lostmark(el){ const {d, a} = ctx(el); reasonModal('Report lost or stolen', 'Locks the phone with a “reported lost” message until it’s marked as recovered.', 'Lock as lost', true, v => { d.flag = 'lost'; ev('admin', 'Reported lost or stolen. ' + v.reason.trim(), {a, d}); evaluate(a); }); },
  lostclear(el){ const {d, a} = ctx(el); act(() => { d.flag = null; ev('admin', 'Marked as recovered.', {a, d}); evaluate(a); }); toast('Marked as recovered.'); },
  writeoff(el){
    const {d, a} = ctx(el), R = remaining(a), Un = unearned(a);
    openModal({title:'Write off account', ok:'Write off', danger:true, body:'<p style="margin:0;color:var(--ink2)">Moves ' + esc(a.customer.name) + '’s unpaid balance to bad debt and closes the account.</p>'
      + '<div class="preview"><div class="sumline"><span>Balance owed</span><span>' + money(R) + '</span></div><div class="sumline"><span>Unearned fees released</span><span>' + money(Un) + '</span></div><div class="sumline big"><span>Loss before recovery</span><span>' + money(R - Un) + '</span></div></div>'
      + fld('Value of device if recovered (GH₵)', '<input name="rec" inputmode="decimal" value="0">', 'If more than 0, the phone returns to stock at that value and is unlocked for resale.') + fld('Reason', '<textarea name="reason"></textarea>'),
      onOk(v){ if (v.reason.trim().length < 3) return 'Add a short reason. It goes in the audit log.'; const rec = cents(v.rec); if (rec > R - Un) return 'Recovered value can’t exceed ' + money(R - Un) + '.'; act(() => { writeOff(a, rec); ev('admin', 'Write‑off reason: ' + v.reason.trim(), {a, d}); }); closeModal(); return false; }});
  },
  idclear(el){ delete PEND[el.dataset.slot]; refreshTile(el.dataset.slot); },
  viewid(el){
    const {d, a} = ctx(el), slot = el.dataset.slot, lab = SLOTS.find(x => x[0] === slot)[1], u = getImg(a.customer.id[slot]);
    if (!u) { toast('That photo is not available in this browser.'); return; }
    act(() => ev('account', 'Viewed ID photo: ' + lab + '.', {a, d}));
    openModal({title:lab + ' – ' + a.customer.name, noOk:true, cancel:'Close', wide:true, body:'<img class="idbig" alt="' + esc(lab) + '" src="' + u + '"><p class="fine" style="margin:0">Viewing ID photos is recorded in the activity log.</p>'});
  },
  editid(el){
    const {d, a} = ctx(el), c = a.customer, idc = c.id || {}; PEND = {};
    SLOTS.forEach(s => { const u = getImg(idc[s[0]]); if (u) PEND[s[0]] = {url:u, w:9999, h:9999}; });
    openModal({title:'ID photos for ' + c.name, ok:'Save', wide:true,
      body:'<div class="mgrid">' + idTypeSel(idc.type) + fld('Last 4 characters of ID number', '<input name="idlast" maxlength="4" value="' + esc(idc.last4 || '') + '">') + '</div>' + idGridHTML(),
      onOk(v){
        if (!PEND.front) return 'Add a photo of the front of the ID.';
        if (!/^[A-Za-z0-9]{4}$/.test(v.idlast.trim())) return 'Enter the last 4 characters of the ID number.';
        act(() => {
          const old = c.id || {}, n = {type:v.idtype, last4:v.idlast.trim().toUpperCase(), day:today(), by:U.name};
          SLOTS.forEach(s => { const k = s[0], p = PEND[k], oid = old[k];
            if (p) { if (oid && getImg(oid) === p.url) n[k] = oid; else { n[k] = putImg(p.url); if (oid) delImg(oid); } }
            else { n[k] = null; if (oid) delImg(oid); } });
          c.id = n; c.idChecked = true; ev('account', 'ID photos ' + (old.front ? 'updated' : 'added') + '.', {a, d});
        });
        closeModal(); toast('ID photos saved.'); return false;
      }});
  },
  editcust(el){ const {d, a} = ctx(el), c = a.customer; openModal({title:'Edit customer', ok:'Save', body:fld('Name', '<input name="name" value="' + esc(c.name) + '">') + fld('Mobile number', '<input name="phone" value="' + esc(c.phone) + '">') + fld('Mobile money number', '<input name="momo" value="' + esc(c.momo ? c.momo.disp : '') + '" placeholder="Same as mobile number">') + fld('Email', '<input name="email" value="' + esc(c.email || '') + '">'),
    onOk(v){ if (!v.name.trim()) return 'Enter a name.'; const gp = ghPhone(v.phone), gm = ghPhone(v.momo || v.phone);
      if (!gp.ok) return 'Enter a valid Ghana mobile number.'; if (!gm.ok || !gm.net) return 'Enter a mobile money number with a MTN, Telecel or AT prefix.';
      act(() => { a.customer.name = v.name.trim(); a.customer.phone = gp.disp; a.customer.momo = {net:gm.net, disp:gm.disp}; a.customer.email = v.email.trim(); ev('account', 'Customer details updated.', {a, d}); }); closeModal(); return false; }}); }
};
function devRows(list){
  return [['Model', 'Serial', 'IMEI', 'Status', 'Customer', 'Days late', 'Balance', 'Last seen']].concat(list.map(d => { const a = acct(d), live = a && a.status === 'active';
    return [d.model, d.serial, d.imei, devState(d).label, a ? a.customer.name : '', live ? Math.max(0, lateDays(a)) : '', live ? remaining(a) / 100 : '', d.lastSeen != null ? fmtY(d.lastSeen) : '']; }));
}

/* =====================================================================
   Events and boot
   ===================================================================== */
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.scrim) { closeModal(); return; }
  const m = document.querySelector('details.menu[open]');
  if (m && !e.target.closest('details.menu')) m.open = false;
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = ACTIONS[t.dataset.a]; if (!fn) return;
  if (t.closest('details.menu') && t.tagName === 'BUTTON') { const dm = t.closest('details.menu'); dm.open = false; }
  fn(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'dq') { ui.q = t.value; $('devtbl').innerHTML = devicesTable(); return; }
  if (MODAL && MODAL.onInput && t.closest('.modal')) MODAL.onInput(modalVals());
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.p; if (!k || !D) return;
  const s = D.settings;
  if (t.type === 'checkbox') s[k] = t.checked;
  else if (k === 'supportPhone' || k === 'lockMessage') s[k] = t.value;
  else if (k === 'feePct' || k === 'procFee') s[k] = Math.max(0, parseFloat(t.value) || 0);
  else s[k] = Math.max(1, parseInt(t.value, 10) || 1);
  if (s.warnAt < s.restrictAt) s.warnAt = s.restrictAt;
  if (s.lockAt < s.warnAt) s.lockAt = s.warnAt + 1;
  act(() => D.accounts.forEach(evaluate)); toast('Saved.');
});
document.addEventListener('change', async e => {
  const t = e.target; if (!t.dataset || !t.dataset.slot || t.type !== 'file') return;
  const f = t.files && t.files[0]; if (!f) return;
  try { PEND[t.dataset.slot] = await compressImage(f); const m = $('merr'); if (m) m.textContent = ''; refreshTile(t.dataset.slot); }
  catch (err) { const m = $('merr'); if (m) m.textContent = err.message; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL) closeModal();
  if (e.key === 'Enter') {
    if (!U && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); authMode === 'in' ? doSignIn() : doSignUp(); }
    else if (e.target.id === 'gq') { ui.q = e.target.value; ui.status = 'all'; location.hash === '#devices' ? render() : (location.hash = 'devices'); setTimeout(() => { const q = $('dq'); if (q) q.focus(); }, 0); }
    else if (MODAL && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); ACTIONS['modal-ok'](); }
  }
});
window.addEventListener('hashchange', () => { if (MODAL) closeModal(); if (route().name !== 'accounting') ui.acctTab = 'overview'; render(); });

(function boot(){
  const sid = store.get('fp:session');
  const u = sid && users().find(x => x.id === sid);
  if (u) openSession(u);
  render();
})();
</script>
